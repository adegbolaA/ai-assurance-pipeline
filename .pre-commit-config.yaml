# Fast local checks before a commit, also run by pre-commit.ci on every PR.
# The heavier gates (policy, evals, scans) live in .github/workflows/ai-gates.yml.
#   pip install pre-commit && pre-commit install

ci:
  # pre-commit.ci runners have no terraform binary; the `iac` job in
  # ai-gates.yml runs fmt/validate/scan for every PR instead.
  skip: [terraform_fmt, terraform_validate]
  autofix_commit_msg: "style: pre-commit auto-fixes"
  autoupdate_commit_msg: "chore(deps): pre-commit autoupdate"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.2
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args: ["--hook-config=--retry-once-with-cleanup=true"]
