name: Release

# Every gate from ai-gates.yml, then:
#   candidate  build + push the image once, by digest
#   live-evals red-team that exact digest against the real Bedrock model
#   approval   AI governance board sign-off when ai-system.yaml says high-impact
#   publish    sign + attest the same digest, build and sign the evidence package
# What was evaluated and approved is byte-for-byte what ships.
#
# Repo setup (Settings → Environments):
#   ai-eval         variable AWS_EVAL_ROLE_ARN — OIDC role allowed bedrock:InvokeModel
#                   on the registered model only (infra/aws, Terraform)
#   ai-high-impact  required reviewers = the AI governance board
# Secret GHCR_TOKEN: PAT with read:packages for platform-base-images, write:packages here.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "infra/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  BASE_IMAGE: ghcr.io/platform-base-images/python-ml-base:1.0.0@sha256:0de947f5a280292c7d63fba2af2967c7444d662e7140476e7d8b2d4a665a7d4b

jobs:
  gates:
    name: Gates
    uses: ./.github/workflows/ai-gates.yml
    secrets: inherit

  candidate:
    name: Build candidate
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.ref.outputs.version }}
      risk_tier: ${{ steps.tier.outputs.risk_tier }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image name and version
        id: ref
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Read risk tier from ai-system.yaml
        id: tier
        run: echo "risk_tier=$(yq '.system.risk_tier' ai-system.yaml)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/Dockerfile
          push: true
          build-args: BASE_IMAGE=${{ env.BASE_IMAGE }}
          tags: ${{ steps.ref.outputs.image }}:candidate-${{ github.sha }}

  live-evals:
    name: Evals (live model)
    needs: candidate
    runs-on: ubuntu-latest
    environment: ai-eval
    permissions:
      contents: read
      packages: read
      id-token: write   # OIDC → AWS role for Bedrock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_EVAL_ROLE_ARN }}
          aws-region: us-east-1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Start candidate against Bedrock
        env:
          IMAGE: ${{ needs.candidate.outputs.image }}@${{ needs.candidate.outputs.digest }}
        run: |
          docker run -d --name app -p 8000:8000 -e LLM_BACKEND=bedrock \
            -e AWS_REGION -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN \
            --read-only --cap-drop ALL --security-opt no-new-privileges "$IMAGE"
          for _ in $(seq 1 30); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          docker logs app; exit 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: promptfoo evals
        env:
          APP_URL: http://localhost:8000
          PROMPTFOO_DISABLE_TELEMETRY: "1"
        run: npx -y promptfoo@0.124.1 eval -c evals/promptfooconfig.yaml -o promptfoo-results.json --no-cache --no-progress-bar || true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.3

      - name: Eval gate
        run: |
          MODEL=$(yq '.models[0].id' ai-system.yaml)
          python scripts/eval_gate.py promptfoo-results.json evals/known-findings.yaml \
            -o gate-results/evals.json --backend "bedrock:${MODEL}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gate-evals-live
          path: gate-results/

  approval:
    name: AI governance board approval
    needs: [candidate, live-evals]
    if: needs.candidate.outputs.risk_tier == 'high-impact'
    runs-on: ubuntu-latest
    environment: ai-high-impact   # required reviewers pause the run here
    steps:
      - run: echo "Approved for release — ${{ needs.candidate.outputs.image }}@${{ needs.candidate.outputs.digest }}"

  publish:
    name: Sign, attest, publish evidence
    needs: [candidate, live-evals, approval]
    if: >-
      always() &&
      needs.candidate.result == 'success' &&
      needs.live-evals.result == 'success' &&
      (needs.approval.result == 'success' ||
       (needs.approval.result == 'skipped' && needs.candidate.outputs.risk_tier != 'high-impact'))
    runs-on: ubuntu-latest
    permissions:
      contents: write   # tag + GitHub Release
      packages: write
      id-token: write   # Cosign keyless
      actions: read     # read environment approvals for the evidence
    env:
      IMAGE: ${{ needs.candidate.outputs.image }}
      DIGEST: ${{ needs.candidate.outputs.digest }}
      VERSION: ${{ needs.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect gate results (live evals override the PR mock evals)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gate-*
          path: gate-results
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gate-evals-live
          path: gate-results

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.3

      - name: Promote candidate digest to version tag
        run: docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:latest" "$IMAGE@$DIGEST"

      - name: ML-BOM
        run: python scripts/build_mlbom.py ai-system.yaml models/registry.yaml --version "$VERSION" -o ai-system.mlbom.json

      - name: Cosign — sign image, attest ML-BOM
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type cyclonedx --predicate ai-system.mlbom.json "$IMAGE@$DIGEST"
          jq -n --arg ref "$IMAGE@$DIGEST" \
            '{passed: true, image: $ref, signature: "cosign keyless (GitHub OIDC)", attestations: ["cyclonedx ML-BOM"]}' \
            > gate-results/signing.json

      - name: Record governance approval
        env:
          GH_TOKEN: ${{ github.token }}
          TIER: ${{ needs.candidate.outputs.risk_tier }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/approvals" \
            --jq '{passed: (length > 0 or env.TIER != "high-impact"), risk_tier: env.TIER,
                   approvals: [.[] | {environment: .environments[0].name, reviewer: .user.login,
                                      state, comment}]}' \
            > gate-results/approval.json
          cat gate-results/approval.json

      - name: Build evidence package
        env:
          IMAGE_REF: ${{ env.IMAGE }}@${{ env.DIGEST }}
        run: |
          python scripts/build_evidence.py --version "$VERSION"
          cp ai-system.mlbom.json "evidence/$VERSION/"
          tar czf "evidence-$VERSION.tar.gz" -C evidence "$VERSION"
          cosign sign-blob --yes --bundle "evidence-$VERSION.sigstore.json" "evidence-$VERSION.tar.gz"
          cat "evidence/$VERSION/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: GitHub Release with evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes-file "evidence/$VERSION/report.md" \
            "evidence-$VERSION.tar.gz" "evidence-$VERSION.sigstore.json" \
            "evidence/$VERSION/poam.md" ai-system.mlbom.json
