name: IaC Gates

# Terraform for the release evals' AWS access (infra/aws). Runs on every PR and
# is called by release.yml, which puts gate-results/checkov.json in the evidence.
#
# On PRs it always triggers but skips the Terraform work when nothing under
# infra/ (or the gate itself) changed. "IaC Summary" therefore always reports a
# result, so it can be a required check without blocking unrelated PRs —
# a workflow-level `paths:` filter would leave a required check pending forever.

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iac-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect IaC changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      iac: ${{ steps.filter.outputs.iac }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            iac:
              - 'infra/**'
              - '.github/workflows/iac.yml'

  terraform:
    name: Terraform + Checkov
    needs: changes
    permissions:
      contents: read
      security-events: write   # upload SARIF to code scanning
    # Non-PR runs (release, manual) skip `changes` and always scan.
    if: >-
      always() &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.iac == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra

      - name: terraform validate (no backend, no credentials)
        working-directory: infra/aws
        run: |
          terraform init -backend=false -input=false
          terraform validate

      # Negative controls: Checkov must flag known-bad Terraform before its
      # verdict on infra/aws counts. Same image (and version) as checkov-action.
      - name: Checkov negative + mutation controls
        env:
          CHECKOV_IMAGE: ghcr.io/bridgecrewio/checkov:3.3.26@sha256:8e63f217cb084f1c1a067326a9cf6e37d54bdc82e5822210d50ca4e2f647dd93
        run: |
          expect_fail() { # <abs dir> <check id> <description>
            set +e
            out=$(docker run --rm -v "$1:/tf:ro" "$CHECKOV_IMAGE" -d /tf --framework terraform --check "$2" --quiet --compact 2>&1)
            rc=$?
            set -e
            if [[ $rc -ne 1 ]] || ! grep -q "$2" <<<"$out"; then
              echo "$out"
              echo "::error::$2 did not flag $3 (checkov exit $rc)"
              exit 1
            fi
            echo "✓ $2 flags $3"
          }

          expect_fail "$GITHUB_WORKSPACE/infra/tests/negative/admin_policy" CKV_AWS_62 "an admin *:* policy"
          expect_fail "$GITHUB_WORKSPACE/infra/tests/negative/oidc_any_repo" CKV_AWS_358 "an OIDC trust open to any repo"

          # Mutation: the real trust policy minus its repo-subject condition must
          # be flagged too. Proves Checkov can see our policy — it silently skips
          # CKV_AWS_358 when it cannot resolve the principal.
          mkdir -p "$RUNNER_TEMP/mutant"
          cp infra/aws/*.tf "$RUNNER_TEMP/mutant/"
          perl -0pi -e 's/\n    condition \{\n      test     = "StringEquals"\n      variable = "\$\{local\.oidc_host\}:sub"\n.*?\n    \}\n/\n/s' "$RUNNER_TEMP/mutant/main.tf"
          if grep -q ':sub"' "$RUNNER_TEMP/mutant/main.tf"; then
            echo "::error::Mutation did not apply — update the pattern in iac.yml to match the :sub condition in infra/aws/main.tf"
            exit 1
          fi
          expect_fail "$RUNNER_TEMP/mutant" CKV_AWS_358 "infra/aws with its :sub condition removed"

      - run: mkdir -p gate-results

      - name: Checkov — scan infra/ (negative fixtures skipped)
        uses: bridgecrewio/checkov-action@c13aafd679d3814a25067d10fcaf98c4f7594931 # v12.3131.0 (checkov 3.3.26)
        with:
          directory: infra
          framework: terraform
          skip_path: infra/tests
          quiet: true
          compact: true
          output_format: cli,sarif,json
          output_file_path: console,results.sarif,gate-results/checkov.json

      - name: Upload findings to code scanning
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
          category: checkov-iac

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gate-iac
          path: gate-results/

  summary:
    name: IaC Summary
    runs-on: ubuntu-latest
    needs: [changes, terraform]
    if: always()
    steps:
      - name: Evaluate results
        env:
          CHANGES: ${{ needs.changes.result }}
          IAC: ${{ needs.changes.outputs.iac }}
          TERRAFORM: ${{ needs.terraform.result }}
        run: |
          echo "changes: $CHANGES (iac changed: ${IAC:-n/a})  terraform: $TERRAFORM"
          if [[ "$TERRAFORM" == "success" ]]; then
            echo "IaC gates passed."
          elif [[ "$TERRAFORM" == "skipped" && "$CHANGES" == "success" && "$IAC" == "false" ]]; then
            echo "No IaC changes in this PR — Terraform gates skipped."
          else
            echo "::error::IaC gates did not pass (terraform: $TERRAFORM, changes: $CHANGES)"
            exit 1
          fi
