name: AI Governance Gates

# Runs on every PR, and is called by release.yml so a release runs exactly the
# same gates. Each job writes its result to gate-results/ and uploads it as a
# gate-* artifact; release.yml turns those into the signed evidence package.
# Terraform for the AWS eval role is gated separately in iac.yml.

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-gates-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  BASE_IMAGE: ghcr.io/platform-base-images/python-ml-base:1.0.0@sha256:0de947f5a280292c7d63fba2af2967c7444d662e7140476e7d8b2d4a665a7d4b

jobs:
  # ── Inventory, registration and provider policy ─────────────────────────────
  policy:
    name: Policy (OPA/Conftest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install conftest
        run: |
          CONFTEST_VERSION=0.71.1
          curl -sSLo conftest.tar.gz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar xzf conftest.tar.gz conftest
          sudo install -m 755 conftest /usr/local/bin/conftest

      - name: Policy unit tests (every rule has a negative control)
        run: conftest verify --policy policy --no-color

      - name: Evaluate ai-system.yaml against registry and provider allowlist
        run: |
          mkdir -p gate-results
          echo "today: \"$(date -u +%F)\"" > policy/data/today.yaml
          set +e
          conftest test --combine ai-system.yaml models/registry.yaml \
            --policy policy --data policy/data --no-color --output json > gate-results/policy.json
          RC=$?
          set -e
          conftest test --combine ai-system.yaml models/registry.yaml \
            --policy policy --data policy/data --no-color || true
          exit $RC

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gate-policy
          path: gate-results/

  # ── Code-level provider and deserialization rules ───────────────────────────
  code-policy:
    name: Code policy (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install semgrep==1.180.0
      - name: Semgrep — AI governance rules
        run: |
          mkdir -p gate-results
          semgrep scan --config policy/semgrep --metrics off --error \
            --json --output gate-results/semgrep.json app scripts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gate-code-policy
          path: gate-results/

  # ── App tests: runtime registry enforcement, AIGG-LAB-04 guard ──────────────
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install --require-hashes -r app/requirements.txt -r app/requirements-dev.txt
      - name: pytest
        working-directory: app
        run: |
          mkdir -p ../gate-results
          python -m pytest -q --junitxml=../gate-results/pytest.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gate-unit-tests
          path: gate-results/

  # ── Data governance: PII in declared data sources ───────────────────────────
  data-governance:
    name: Data governance (Presidio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          pip install presidio-analyzer==2.2.364 pyyaml==6.0.3 pytest==9.1.1 \
            https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
      - name: Negative control — scanner detects planted PII
        run: python -m pytest -q scripts/tests/test_pii_scan.py
      - name: Scan declared data sources
        run: python scripts/pii_scan.py ai-system.yaml -o gate-results/pii.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gate-pii
          path: gate-results/

  # ── Model supply chain: unsafe serialization ────────────────────────────────
  modelscan:
    name: Model scan (ModelScan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install modelscan==0.8.8
      - run: bash scripts/modelscan_gate.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gate-modelscan
          path: gate-results/

  # ── Build on python-ml-base, CVE scan, red-team evals against mock model ────
  evals:
    name: Image scan + evals (mock model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR (pull hardened base image)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build app image
        run: docker build -f app/Dockerfile --build-arg BASE_IMAGE=${{ env.BASE_IMAGE }} -t aigg-app:ci .

      - name: Trivy CVE gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aigg-app:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Start app (mock model, hardened runtime flags)
        run: |
          docker run -d --name app -p 8000:8000 -e LLM_BACKEND=mock \
            --read-only --cap-drop ALL --security-opt no-new-privileges aigg-app:ci
          for _ in $(seq 1 30); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          docker logs app; exit 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: promptfoo red-team + accuracy evals
        env:
          APP_URL: http://localhost:8000
          PROMPTFOO_DISABLE_TELEMETRY: "1"
        run: npx -y promptfoo@0.124.1 eval -c evals/promptfooconfig.yaml -o promptfoo-results.json --no-cache --no-progress-bar || true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.3

      - name: Eval gate — new failures block, tracked POA&M findings do not
        run: python scripts/eval_gate.py promptfoo-results.json evals/known-findings.yaml -o gate-results/evals.json --backend mock

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gate-evals-mock
          path: gate-results/

  # ── Single required status check for branch protection ──────────────────────
  summary:
    name: AI Gate Summary
    runs-on: ubuntu-latest
    needs: [policy, code-policy, unit-tests, data-governance, modelscan, evals]
    if: always()
    steps:
      - name: Evaluate results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          FAILED=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [[ -n "$FAILED" ]]; then
            echo "::error::Gates did not pass: $FAILED"
            exit 1
          fi
          echo "All AI governance gates passed."
